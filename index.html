<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 场景合集</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #07080f;
      color: #d8e2f2;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    }
    main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
    h1 { margin: 0 0 8px; font-size: 30px; letter-spacing: 4px; color: #fff; }
    .intro { margin: 0 0 36px; opacity: 0.7; }
    .scene {
      display: block;
      padding: 20px 22px;
      margin-bottom: 16px;
      border: 1px solid #1f2540;
      border-radius: 10px;
      background: #0d1020;
      color: inherit;
      text-decoration: none;
    }
    .scene h2 { margin: 0 0 6px; font-size: 19px; color: #fff; }
    .scene p { margin: 0 0 10px; opacity: 0.75; line-height: 1.6; }
    .links a { color: #8fe3ff; margin-right: 18px; text-decoration: none; }
    .links a:hover { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 13px; opacity: 0.5; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>3D 场景合集</h1>
    <p class="intro">用 three.js 搭建的 3D 场景，点击即可在浏览器中打开（需要较新的电脑浏览器）。</p>

    <div class="scene">
      <h2>夜幕下的繁华都市</h2>
      <p>程序生成的夜间大都市：看得到房间内部的窗户、真实的树木、LED 大屏、霓虹招牌和车流；另有一条雨夜霓虹小巷。</p>
      <div class="links">
        <a href="./night-city/">城市全景 →</a>
        <a href="./night-city/alley.html">雨夜小巷 →</a>
      </div>
    </div>

    <div class="scene">
      <h2>被自然收回的城市街角</h2>
      <p>三渲二风格的悬浮微缩场景：半塌的建筑、破顶而出的榕树、被植物占据的街道、铁路和水田。对显卡要求较高。</p>
      <div class="links">
        <a href="./reclaimed-street-corner/%E8%A2%AB%E8%87%AA%E7%84%B6%E6%94%B6%E5%9B%9E%E7%9A%84%E5%9F%8E%E5%B8%82%E8%A1%97%E8%A7%92.html">打开场景 →</a>
        <a href="./reclaimed-street-corner/versions/v2-40x40/%E8%A2%AB%E8%87%AA%E7%84%B6%E6%94%B6%E5%9B%9E%E7%9A%84%E5%9F%8E%E5%B8%82%E8%A1%97%E8%A7%92.html">第二版</a>
        <a href="./reclaimed-street-corner/versions/v1-24x24/%E8%A2%AB%E8%87%AA%E7%84%B6%E6%94%B6%E5%9B%9E%E7%9A%84%E5%9F%8E%E5%B8%82%E8%A1%97%E8%A7%92.html">第一版</a>
      </div>
    </div>

    <footer>
      源代码：<a href="https://github.com/yxengram/3D">github.com/yxengram/3D</a>
    </footer>
  </main>
</body>
</html>
