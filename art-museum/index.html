<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,">
<title>艺术博物馆</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#15171a;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif}
canvas{display:block;position:fixed;inset:0;width:100%;height:100%;touch-action:none;outline:none;opacity:0;transition:opacity .9s}
body.ready canvas{opacity:1}
body.shot canvas{transition:none}
body.shot #bar{display:none}
#bar{position:fixed;left:0;top:0;height:2px;width:100%;background:#d8c7a6;transform-origin:0 50%;transform:scaleX(0);transition:transform .3s,opacity .6s}
body.ready #bar{opacity:0}
#fade{position:fixed;inset:0;background:#0d0e10;opacity:0;pointer-events:none;transition:opacity .26s}
#fade.on{opacity:1}
#ui{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;opacity:0;transition:opacity .8s .4s}
body.ready #ui{opacity:1}
#hint{font-size:12px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55);opacity:0;transition:opacity .8s}
#hint.on{opacity:.82}
#tabs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(18,19,22,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);pointer-events:auto}
#tabs button{all:unset;cursor:pointer;font-size:13px;letter-spacing:.18em;padding:7px 16px 7px 18px;border-radius:999px;color:rgba(255,255,255,.72);transition:background .25s,color .25s}
#tabs button:hover{color:#fff}
#tabs button.on{background:rgba(255,255,255,.9);color:#1c1d20}
#tabs button:focus-visible{outline:2px solid #fff;outline-offset:2px}
body.fail #ui{opacity:1;transition:none}
body.fail #tabs,body.fail #bar{display:none}
body.fail #hint{opacity:.9;font-size:14px}
</style>
</head>
